server.port=${SERVER_PORT:8080}
sales.csv.path=${SALES_CSV_PATH:../data/sales.csv}
sales.import.dir=${SALES_IMPORT_DIR:../runtime/sales-imports}
sales.import.max-bytes=${SALES_IMPORT_MAX_BYTES:10485760}
sales.import.max-rows=${SALES_IMPORT_MAX_ROWS:100000}
sales.import.preview-minutes=${SALES_IMPORT_PREVIEW_MINUTES:30}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.property-naming-strategy=SNAKE_CASE
server.error.include-message=always
